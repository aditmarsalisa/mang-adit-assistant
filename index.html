<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asisten Guru Online - Final</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Library SheetJS untuk membaca file Excel (.xlsx, .xls, .csv) secara nyata -->
    <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased min-h-screen flex flex-col">

    <!-- KONFIGURASI URL APPS SCRIPT ANDA -->
    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbw0xMHb4ssQ_F_0k0krhq5jUht_VXamjJlph8_rDVjAXg0Ll_2r7V2kYTreMLJzd3PM/exec";
    </script>

    <!-- CONTAINER UTAMA -->
    <div id="app" class="flex-1 flex flex-col"></div>

    <!-- SCRIPT UTAMA APLIKASI -->
    <script>
        let currentUser = null;
        let currentUserName = "Guru";
        let appData = {
            schedules: [],
            students: [], // { id, name, nis, className }
            attendance: {}, // { "YYYY-MM-DD": { studentId: "hadir"|"sakit"|"izin"|"alpa" } }
            grades: {}, // { studentId: { tugas, uh, pts, pas, finalScore, predicate } }
            lessonPlans: [],
            gridCards: [],
            questionBanks: []
        };
        let activePortal = null;
        let ttsEnabled = false;
        let ttsInterval = null;

        // ==================== AUTHENTICATION ====================
        function renderAuth(view = 'login') {
            const app = document.getElementById('app');
            if (view === 'login') {
                app.innerHTML = `
                    <div class="flex-1 flex items-center justify-center p-4 bg-gradient-to-br from-indigo-50 to-blue-100">
                        <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md border border-slate-100">
                            <div class="text-center mb-8">
                                <div class="bg-indigo-600 text-white w-14 h-14 rounded-2xl flex items-center justify-center mx-auto mb-4 text-2xl shadow-lg shadow-indigo-200">
                                    <i class="fa-solid fa-graduation-cap"></i>
                                </div>
                                <h1 class="text-2xl font-bold text-slate-900">Asisten Guru Online</h1>
                                <p class="text-sm text-slate-500 mt-1">Masuk untuk mengelola administrasi pembelajaran</p>
                            </div>
                            <form onsubmit="handleLoginSubmit(event)" class="space-y-4">
                                <div>
                                    <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Email Terdaftar</label>
                                    <input type="email" id="loginEmail" required class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:ring-2 focus:ring-indigo-500 focus:outline-none text-sm" placeholder="guru@sekolah.sch.id">
                                </div>
                                <div>
                                    <div class="flex justify-between items-center mb-1">
                                        <label class="block text-xs font-semibold uppercase text-slate-500">Kata Sandi</label>
                                        <button type="button" onclick="renderAuth('forgot')" class="text-xs text-indigo-600 hover:underline font-medium">Lupa sandi?</button>
                                    </div>
                                    <input type="password" id="loginPassword" required class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:ring-2 focus:ring-indigo-500 focus:outline-none text-sm" placeholder="••••••••">
                                </div>
                                <button type="submit" id="loginBtn" class="w-full py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold rounded-xl shadow-md transition text-sm">
                                    Masuk ke Aplikasi
                                </button>
                            </form>
                            <div class="mt-6 text-center text-sm text-slate-500">
                                Belum punya akun? <button onclick="renderAuth('register')" class="text-indigo-600 font-semibold hover:underline">Daftar sekarang</button>
                            </div>
                        </div>
                    </div>
                `;
            } else if (view === 'register') {
                app.innerHTML = `
                    <div class="flex-1 flex items-center justify-center p-4 bg-gradient-to-br from-indigo-50 to-blue-100">
                        <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md border border-slate-100">
                            <div class="text-center mb-6">
                                <h1 class="text-2xl font-bold text-slate-900">Daftar Akun Baru</h1>
                                <p class="text-sm text-slate-500 mt-1">Buat akun Asisten Guru Anda</p>
                            </div>
                            <form onsubmit="handleRegisterSubmit(event)" class="space-y-4">
                                <div>
                                    <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Nama Lengkap & Gelar</label>
                                    <input type="text" id="regName" required class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:ring-2 focus:ring-indigo-500 focus:outline-none text-sm" placeholder="Budi Santoso, S.Pd.">
                                </div>
                                <div>
                                    <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Email Aktif</label>
                                    <input type="email" id="regEmail" required class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:ring-2 focus:ring-indigo-500 focus:outline-none text-sm" placeholder="guru@sekolah.sch.id">
                                </div>
                                <div>
                                    <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Kata Sandi</label>
                                    <input type="password" id="regPassword" required class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:ring-2 focus:ring-indigo-500 focus:outline-none text-sm" placeholder="••••••••">
                                </div>
                                <button type="submit" id="regBtn" class="w-full py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold rounded-xl shadow-md transition text-sm">
                                    Daftar Akun
                                </button>
                            </form>
                            <div class="mt-6 text-center text-sm text-slate-500">
                                Sudah punya akun? <button onclick="renderAuth('login')" class="text-indigo-600 font-semibold hover:underline">Masuk</button>
                            </div>
                        </div>
                    </div>
                `;
            } else if (view === 'forgot') {
                app.innerHTML = `
                    <div class="flex-1 flex items-center justify-center p-4 bg-gradient-to-br from-indigo-50 to-blue-100">
                        <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md border border-slate-100">
                            <div class="text-center mb-6">
                                <h1 class="text-2xl font-bold text-slate-900">Atur Ulang Sandi</h1>
                                <p class="text-sm text-slate-500 mt-1">Kode OTP pemulihan akan dikirim ke email Anda</p>
                            </div>
                            <div id="forgotStep1">
                                <form onsubmit="handleRequestOTP(event)" class="space-y-4">
                                    <div>
                                        <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Email Terdaftar</label>
                                        <input type="email" id="forgotEmail" required class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:ring-2 focus:ring-indigo-500 focus:outline-none text-sm" placeholder="guru@sekolah.sch.id">
                                    </div>
                                    <button type="submit" id="otpReqBtn" class="w-full py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold rounded-xl shadow-md transition text-sm">
                                        Kirim Kode OTP ke Email
                                    </button>
                                </form>
                            </div>
                            <div id="forgotStep2" class="hidden space-y-4">
                                <form onsubmit="handleVerifyOTPAndReset(event)" class="space-y-4">
                                    <div>
                                        <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Kode OTP 6 Digit</label>
                                        <input type="text" id="otpCode" required class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:ring-2 focus:ring-indigo-500 focus:outline-none text-sm text-center tracking-widest text-lg font-bold" placeholder="123456">
                                    </div>
                                    <div>
                                        <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Kata Sandi Baru</label>
                                        <input type="password" id="newPassword" required class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:ring-2 focus:ring-indigo-500 focus:outline-none text-sm" placeholder="••••••••">
                                    </div>
                                    <button type="submit" id="otpResetBtn" class="w-full py-3 bg-emerald-600 hover:bg-emerald-700 text-white font-semibold rounded-xl shadow-md transition text-sm">
                                        Simpan Sandi Baru
                                    </button>
                                </form>
                            </div>
                            <div class="mt-6 text-center text-sm text-slate-500">
                                <button onclick="renderAuth('login')" class="text-indigo-600 font-semibold hover:underline">← Kembali ke Halaman Masuk</button>
                            </div>
                        </div>
                    </div>
                `;
            }
        }

        async function handleLoginSubmit(e) {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;
            const btn = document.getElementById('loginBtn');
            btn.innerText = "Memproses...";
            btn.disabled = true;

            try {
                const res = await fetch(SCRIPT_URL, {
                    method: 'POST',
                    body: JSON.stringify({ action: 'login', email, password })
                });
                const data = await res.json();
                if (data.status === 'success') {
                    currentUser = email;
                    currentUserName = data.name || email.split('@')[0];
                    if (data.appData) {
                        appData = { ...appData, ...data.appData };
                    }
                    renderPortalSelector();
                } else {
                    alert(data.message);
                    btn.innerText = "Masuk ke Aplikasi";
                    btn.disabled = false;
                }
            } catch (err) {
                alert("Koneksi gagal: " + err.message);
                btn.innerText = "Masuk ke Aplikasi";
                btn.disabled = false;
            }
        }

        async function handleRegisterSubmit(e) {
            e.preventDefault();
            const name = document.getElementById('regName').value;
            const email = document.getElementById('regEmail').value;
            const password = document.getElementById('regPassword').value;
            const btn = document.getElementById('regBtn');
            btn.innerText = "Mendaftarkan...";
            btn.disabled = true;

            try {
                const res = await fetch(SCRIPT_URL, {
                    method: 'POST',
                    body: JSON.stringify({ action: 'register', name, email, password })
                });
                const data = await res.json();
                alert(data.message);
                if (data.status === 'success') {
                    renderAuth('login');
                } else {
                    btn.innerText = "Daftar Akun";
                    btn.disabled = false;
                }
            } catch (err) {
                alert("Koneksi gagal: " + err.message);
                btn.innerText = "Daftar Akun";
                btn.disabled = false;
            }
        }

        async function handleRequestOTP(e) {
            e.preventDefault();
            const email = document.getElementById('forgotEmail').value;
            const btn = document.getElementById('otpReqBtn');
            btn.innerText = "Mengirim OTP...";
            btn.disabled = true;

            try {
                const res = await fetch(SCRIPT_URL, {
                    method: 'POST',
                    body: JSON.stringify({ action: 'request_otp', email })
                });
                const data = await res.json();
                alert(data.message);
                if (data.status === 'success') {
                    document.getElementById('forgotStep1').classList.add('hidden');
                    document.getElementById('forgotStep2').classList.remove('hidden');
                } else {
                    btn.innerText = "Kirim Kode OTP ke Email";
                    btn.disabled = false;
                }
            } catch (err) {
                alert("Koneksi gagal: " + err.message);
                btn.innerText = "Kirim Kode OTP ke Email";
                btn.disabled = false;
            }
        }

        async function handleVerifyOTPAndReset(e) {
            e.preventDefault();
            const email = document.getElementById('forgotEmail').value;
            const otp = document.getElementById('otpCode').value;
            const newPassword = document.getElementById('newPassword').value;
            const btn = document.getElementById('otpResetBtn');
            btn.innerText = "Menyimpan...";
            btn.disabled = true;

            try {
                const res = await fetch(SCRIPT_URL, {
                    method: 'POST',
                    body: JSON.stringify({ action: 'reset_password_otp', email, otp, newPassword })
                });
                const data = await res.json();
                alert(data.message);
                if (data.status === 'success') {
                    renderAuth('login');
                } else {
                    btn.innerText = "Simpan Sandi Baru";
                    btn.disabled = false;
                }
            } catch (err) {
                alert("Koneksi gagal: " + err.message);
                btn.innerText = "Simpan Sandi Baru";
                btn.disabled = false;
            }
        }

        async function saveDataToCloud(showToast = false) {
            if (!currentUser) return;
            try {
                await fetch(SCRIPT_URL, {
                    method: 'POST',
                    body: JSON.stringify({ action: 'save_data', email: currentUser, appData })
                });
                if (showToast) alert("Data berhasil disimpan & disinkronkan ke Google Drive!");
            } catch (err) {
                console.error("Gagal sinkronisasi:", err);
                if (showToast) alert("Gagal menyinkronkan ke server: " + err.message);
            }
        }

        // ==================== PORTAL SELECTOR ====================
        function renderPortalSelector() {
            activePortal = null;
            const app = document.getElementById('app');
            app.innerHTML = `
                <div class="flex-1 flex flex-col justify-center items-center p-6 bg-gradient-to-br from-slate-100 to-indigo-50">
                    <div class="max-w-4xl w-full text-center">
                        <div class="flex justify-between items-center mb-8 px-4">
                            <div class="text-left">
                                <span class="text-xs font-bold uppercase tracking-wider text-indigo-600">Selamat Datang, ${currentUserName}</span>
                                <h1 class="text-2xl font-bold text-slate-900">Pilih Ruang Kerja Utama</h1>
                                <p class="text-sm text-slate-500">Silakan pilih portal administrasi yang ingin Anda akses</p>
                            </div>
                            <button onclick="currentUser=null; renderAuth('login')" class="px-4 py-2 bg-white border border-slate-200 text-rose-600 hover:bg-rose-50 rounded-xl text-sm font-semibold shadow-sm transition">
                                <i class="fa-solid fa-arrow-right-from-bracket mr-2"></i>Keluar
                            </button>
                        </div>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                            <div onclick="enterPortal('perangkat')" class="bg-white p-8 rounded-2xl shadow-xl border border-slate-100 hover:border-indigo-500 cursor-pointer transition transform hover:-translate-y-1 text-left group">
                                <div class="bg-indigo-100 text-indigo-600 w-14 h-14 rounded-2xl flex items-center justify-center text-2xl mb-6 group-hover:bg-indigo-600 group-hover:text-white transition">
                                    <i class="fa-solid fa-book-open"></i>
                                </div>
                                <h2 class="text-xl font-bold text-slate-900 mb-2">1. Perangkat Ajar</h2>
                                <p class="text-sm text-slate-500 mb-4">Modul Ajar/RPP, Bahan Ajar, Kisi-Kisi, Bank Soal (Impor File), Rubrik, dan Ekspor GForm.</p>
                                <span class="text-indigo-600 font-semibold text-sm flex items-center">Buka Portal <i class="fa-solid fa-arrow-right ml-2"></i></span>
                            </div>
                            <div onclick="enterPortal('jurnal')" class="bg-white p-8 rounded-2xl shadow-xl border border-slate-100 hover:border-emerald-500 cursor-pointer transition transform hover:-translate-y-1 text-left group">
                                <div class="bg-emerald-100 text-emerald-600 w-14 h-14 rounded-2xl flex items-center justify-center text-2xl mb-6 group-hover:bg-emerald-600 group-hover:text-white transition">
                                    <i class="fa-solid fa-clipboard-user"></i>
                                </div>
                                <h2 class="text-xl font-bold text-slate-900 mb-2">2. Jurnal Guru</h2>
                                <p class="text-sm text-slate-500 mb-4">Jadwal Mengajar & TTS, Data Siswa (Manual & Excel), Presensi, dan Kalkulator Rekap Nilai.</p>
                                <span class="text-emerald-600 font-semibold text-sm flex items-center">Buka Portal <i class="fa-solid fa-arrow-right ml-2"></i></span>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        function enterPortal(portal) {
            activePortal = portal;
            if (portal === 'perangkat') {
                renderPerangkatAjarApp();
            } else {
                renderJurnalGuruApp();
            }
        }

        // ==================== 1. PORTAL PERANGKAT AJAR ====================
        function renderPerangkatAjarApp() {
            const app = document.getElementById('app');
            app.innerHTML = `
                <div class="max-w-6xl mx-auto w-full p-4 md:p-6 space-y-6">
                    <!-- Banner Header -->
                    <div class="bg-indigo-950 text-white p-5 rounded-2xl shadow-lg flex flex-wrap justify-between items-center gap-4">
                        <div class="flex items-center space-x-4">
                            <button onclick="renderPortalSelector()" class="px-3 py-2 bg-indigo-900 hover:bg-indigo-800 rounded-xl text-xs font-semibold flex items-center transition">
                                <i class="fa-solid fa-arrow-left mr-2"></i> Menu Utama
                            </button>
                            <div>
                                <span class="px-2 py-0.5 bg-indigo-600 text-[10px] font-bold uppercase rounded tracking-wider">Perangkat Ajar</span>
                                <h1 class="font-bold text-lg md:text-xl mt-0.5">Ruang Penyusunan Administrasi Pembelajaran</h1>
                            </div>
                        </div>
                        <div class="flex items-center space-x-2">
                            <button onclick="enterPortal('jurnal')" class="px-3 py-2 bg-indigo-600 hover:bg-indigo-500 rounded-xl text-xs font-semibold transition">
                                Pindah Portal <i class="fa-solid fa-right-left ml-1"></i>
                            </button>
                            <button onclick="currentUser=null; renderAuth('login')" class="px-3 py-2 bg-rose-500 hover:bg-rose-600 rounded-xl text-xs font-semibold transition">
                                Keluar
                            </button>
                        </div>
                    </div>

                    <!-- Navigation Pills -->
                    <div class="grid grid-cols-3 gap-3">
                        <button onclick="switchPerangkatTab('modul')" id="pTabModul" class="py-3 px-4 rounded-xl font-semibold text-sm shadow-sm transition flex items-center justify-center">
                            <i class="fa-solid fa-file-lines mr-2"></i> Modul & Bahan Ajar
                        </button>
                        <button onclick="switchPerangkatTab('kisi')" id="pTabKisi" class="py-3 px-4 rounded-xl font-semibold text-sm shadow-sm transition flex items-center justify-center">
                            <i class="fa-solid fa-table-list mr-2"></i> Kisi-Kisi Soal
                        </button>
                        <button onclick="switchPerangkatTab('soal')" id="pTabSoal" class="py-3 px-4 rounded-xl font-semibold text-sm shadow-sm transition flex items-center justify-center">
                            <i class="fa-solid fa-list-check mr-2"></i> Bank Soal & GForm
                        </button>
                    </div>

                    <div id="perangkatContent"></div>
                </div>
            `;
            switchPerangkatTab('modul');
        }

        function switchPerangkatTab(tab) {
            ['Modul', 'Kisi', 'Soal'].forEach(t => {
                const el = document.getElementById('pTab' + t);
                if (el) {
                    const isActive = t.toLowerCase() === tab.toLowerCase();
                    el.className = isActive
                        ? 'py-3 px-4 rounded-xl font-semibold text-sm shadow-md transition flex items-center justify-center bg-indigo-600 text-white'
                        : 'py-3 px-4 rounded-xl font-semibold text-sm shadow-sm transition flex items-center justify-center bg-white text-slate-600 hover:bg-slate-100 border border-slate-200';
                }
            });

            const container = document.getElementById('perangkatContent');
            if (tab === 'modul') {
                container.innerHTML = `
                    <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 space-y-4">
                        <div class="flex justify-between items-center flex-wrap gap-2">
                            <div>
                                <h2 class="text-lg font-bold text-slate-900">Modul Ajar / RPP & Bahan Ajar</h2>
                                <p class="text-xs text-slate-500">Susun perangkat pembelajaran Kurikulum Merdeka.</p>
                            </div>
                            <button onclick="fillModulTemplate()" class="px-3 py-2 bg-indigo-50 text-indigo-700 hover:bg-indigo-100 rounded-xl text-xs font-semibold">
                                <i class="fa-solid fa-wand-magic-sparkles mr-1"></i> Templat Kurikulum Merdeka
                            </button>
                        </div>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                            <input type="text" id="modulTitle" placeholder="Judul Modul / Materi Pokok" class="p-2.5 border border-slate-200 rounded-xl text-sm">
                            <input type="text" id="modulClass" placeholder="Fase / Kelas (Contoh: Fase D / Kelas 7)" class="p-2.5 border border-slate-200 rounded-xl text-sm">
                        </div>
                        <textarea id="modulBody" class="w-full h-44 p-3 border border-slate-200 rounded-xl text-sm" placeholder="Tujuan Pembelajaran, Pemahaman Bermakna, Langkah Kegiatan Pembelajaran, dan Ringkasan Bahan Ajar..."></textarea>
                        <div class="flex justify-end space-x-2">
                            <button onclick="saveModulItem()" class="px-4 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl text-sm font-semibold shadow">
                                <i class="fa-solid fa-cloud-arrow-up mr-1"></i> Simpan ke Cloud
                            </button>
                        </div>
                        <div class="pt-4 border-t border-slate-100">
                            <h3 class="font-bold text-sm text-slate-700 mb-3">Daftar Modul Tersimpan (${appData.lessonPlans.length})</h3>
                            <div class="space-y-2">
                                ${appData.lessonPlans.map((m, idx) => `
                                    <div class="p-3 bg-slate-50 border border-slate-200 rounded-xl flex justify-between items-center">
                                        <div>
                                            <span class="font-bold text-sm text-slate-800">${m.title}</span>
                                            <span class="ml-2 text-xs px-2 py-0.5 bg-indigo-100 text-indigo-700 rounded">${m.className}</span>
                                        </div>
                                        <button onclick="appData.lessonPlans.splice(${idx},1); saveDataToCloud(); switchPerangkatTab('modul')" class="text-rose-600 text-xs font-semibold hover:underline">Hapus</button>
                                    </div>
                                `).join('') || '<p class="text-xs text-slate-400">Belum ada modul ajar tersimpan.</p>'}
                            </div>
                        </div>
                    </div>
                `;
            } else if (tab === 'kisi') {
                container.innerHTML = `
                    <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 space-y-4">
                        <h2 class="text-lg font-bold text-slate-900">Penyusunan Kisi-Kisi Instrumen Penilaian</h2>
                        <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
                            <input type="text" id="kisiKd" placeholder="Capaian / Tujuan Pembelajaran" class="p-2.5 border border-slate-200 rounded-xl text-sm">
                            <input type="text" id="kisiIndikator" placeholder="Indikator Soal" class="p-2.5 border border-slate-200 rounded-xl text-sm">
                            <select id="kisiLevel" class="p-2.5 border border-slate-200 rounded-xl text-sm">
                                <option value="L1 (C1-C2) Pemahaman">L1 (C1-C2) Pemahaman</option>
                                <option value="L2 (C3) Penerapan">L2 (C3) Penerapan</option>
                                <option value="L3 (C4-C6) Penalaran/HOTS">L3 (C4-C6) Penalaran/HOTS</option>
                            </select>
                        </div>
                        <button onclick="addKisiItem()" class="px-4 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl text-sm font-semibold shadow">
                            + Tambah Baris Kisi-Kisi
                        </button>
                        <div class="overflow-x-auto pt-2">

        function importQuestionsFromFile(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(evt) {
                const data = new Uint8Array(evt.target.result);
                const workbook = XLSX.read(data, { type: 'array' });
                const sheet = workbook.Sheets[workbook.SheetNames[0]];
                const rows = XLSX.utils.sheet_to_json(sheet);
                let added = 0;
                rows.forEach(r => {
                    const q = r.Soal || r.Pertanyaan || r.question;
                    if (q) {
                        appData.questionBanks.push({
                            question: String(q),
                            a: String(r.A || r.OpsiA || ''),
                            b: String(r.B || r.OpsiB || ''),
                            c: String(r.C || r.OpsiC || ''),
                            d: String(r.D || r.OpsiD || ''),
                            key: String(r.Kunci || r.Key || 'A').toUpperCase(),
                            rubric: String(r.Rubrik || '')
                        });
                        added++;
                    }
                });
                saveDataToCloud();
                switchPerangkatTab('soal');
                alert(`Berhasil mengimpor ${added} butir soal dari file!`);
            };
            reader.readAsArrayBuffer(file);
        }

        function exportQuestionsToGForm() {
            if (appData.questionBanks.length === 0) return alert("Belum ada soal untuk diekspor!");
            let textOut = "FORMAT EKSPOR GOOGLE FORMS (Salin & Tempel ke Google Forms / Form Builder)\n======================================================\n\n";
            appData.questionBanks.forEach((q, idx) => {
                textOut += `${idx + 1}. ${q.question}\n`;
                if (q.a) textOut += `   A. ${q.a}\n`;
                if (q.b) textOut += `   B. ${q.b}\n`;
                if (q.c) textOut += `   C. ${q.c}\n`;
                if (q.d) textOut += `   D. ${q.d}\n`;
                textOut += `   [Kunci Jawaban: ${q.key}]\n\n`;
            });
            const blob = new Blob([textOut], { type: "text/plain;charset=utf-8" });
            const url = URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.href = url;
            a.download = "Ekspor_Soal_GForm.txt";
            a.click();
            alert("File format Google Forms (Ekspor_Soal_GForm.txt) berhasil diunduh!");
        }

                                    <i class="fa-solid fa-check-double mr-1.5"></i> Hadir Semua
                                </button>
                            </div>
                        </div>

                        <div class="overflow-x-auto">
                            <table class="w-full text-left text-sm border-collapse">
                                <thead class="bg-slate-100 text-slate-700">
                                    <tr>
                                        <th class="p-3 rounded-tl-xl">No</th>
                                        <th class="p-3">Nama Siswa</th>
                                        <th class="p-3">Kelas</th>
                                        <th class="p-3 rounded-tr-xl text-center">Keterangan Kehadiran</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    ${appData.students.map((st, idx) => {
                                        const status = dailyAtt[st.id] || '';
                                        return `
                                        <tr class="border-b border-slate-100">
                                            <td class="p-3">${idx + 1}</td>
                                            <td class="p-3 font-semibold text-slate-800">${st.name}</td>
                                            <td class="p-3 text-xs text-slate-500">${st.className}</td>
                                            <td class="p-3">
                                                <div class="flex justify-center space-x-2 sm:space-x-3">
                                                    <label class="cursor-pointer px-2.5 py-1 rounded-lg border text-xs font-semibold flex items-center ${status === 'hadir' ? 'bg-emerald-600 text-white border-emerald-600' : 'bg-white text-slate-600 border-slate-200'}">
                                                        <input type="radio" name="att_${st.id}" value="hadir" ${status === 'hadir' ? 'checked' : ''} onchange="setStudentAttendance('${selectedDate}', '${st.id}', 'hadir')" class="hidden"> H (Hadir)
                                                    </label>
                                                    <label class="cursor-pointer px-2.5 py-1 rounded-lg border text-xs font-semibold flex items-center ${status === 'sakit' ? 'bg-amber-500 text-white border-amber-500' : 'bg-white text-slate-600 border-slate-200'}">
                                                        <input type="radio" name="att_${st.id}" value="sakit" ${status === 'sakit' ? 'checked' : ''} onchange="setStudentAttendance('${selectedDate}', '${st.id}', 'sakit')" class="hidden"> S (Sakit)
                                                    </label>
                                                    <label class="cursor-pointer px-2.5 py-1 rounded-lg border text-xs font-semibold flex items-center ${status === 'izin' ? 'bg-blue-500 text-white border-blue-500' : 'bg-white text-slate-600 border-slate-200'}">
                                                        <input type="radio" name="att_${st.id}" value="izin" ${status === 'izin' ? 'checked' : ''} onchange="setStudentAttendance('${selectedDate}', '${st.id}', 'izin')" class="hidden"> I (Izin)
                                                    </label>
                                                    <label class="cursor-pointer px-2.5 py-1 rounded-lg border text-xs font-semibold flex items-center ${status === 'alpa' ? 'bg-rose-600 text-white border-rose-600' : 'bg-white text-slate-600 border-slate-200'}">
                                                        <input type="radio" name="att_${st.id}" value="alpa" ${status === 'alpa' ? 'checked' : ''} onchange="setStudentAttendance('${selectedDate}', '${st.id}', 'alpa')" class="hidden"> A (Alpa)
                                                    </label>
                                                </div>
                                            </td>
                                        </tr>`;
                                    }).join('') || '<tr><td colspan="4" class="p-6 text-center text-xs text-slate-400">Belum ada data siswa. Tambahkan siswa terlebih dahulu di tab Data Siswa.</td></tr>'}
                                </tbody>
                            </table>
                        </div>
                        <div class="flex justify-end">
                            <button onclick="saveDataToCloud(true)" class="px-5 py-2.5 bg-[#0d8a5e] hover:bg-emerald-700 text-white rounded-xl text-xs font-semibold shadow">
                                <i class="fa-solid fa-floppy-disk mr-1.5"></i> Simpan Presensi Hari Ini
                            </button>
                        </div>
                    </div>
                `;
            }

            // TAB 4: REKAP NILAI (DENGAN KALKULATOR OTOMATIS)
            else if (tab === 'nilai') {
                container.innerHTML = `
                    <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 space-y-5">
                        <div class="flex flex-wrap justify-between items-center gap-3">
                            <div>
                                <h2 class="text-lg font-bold text-slate-900">Kalkulator Rekap Nilai Akhir Otomatis</h2>
                                <p class="text-xs text-slate-500">Masukkan nilai komponen di bawah ini; Nilai Akhir & Predikat dihitung otomatis secara real-time.</p>
                            </div>
                            <button onclick="saveDataToCloud(true)" class="px-4 py-2.5 bg-[#0d8a5e] hover:bg-emerald-700 text-white rounded-xl text-xs font-semibold shadow">
                                <i class="fa-solid fa-cloud-arrow-up mr-1.5"></i> Simpan Semua Nilai
                            </button>
                        </div>

                        <!-- Pengaturan Bobot Kalkulator -->
                        <div class="p-4 bg-slate-50 border border-slate-200 rounded-2xl grid grid-cols-2 md:grid-cols-5 gap-3 items-center">
                            <div class="col-span-2 md:col-span-1">
                                <span class="text-xs font-bold text-slate-700 block"><i class="fa-solid fa-calculator text-emerald-600 mr-1"></i> Bobot Nilai (%)</span>
                                <span class="text-[11px] text-slate-500">Total ideal = 100%</span>
                            </div>
                            <div>
                                <label class="block text-[11px] font-semibold text-slate-600">Tugas (%)</label>
                                <input type="number" id="wTugas" value="25" onchange="recalculateAllGrades()" class="w-full p-2 border border-slate-200 rounded-lg text-xs font-bold bg-white">
                            </div>
                            <div>
                                <label class="block text-[11px] font-semibold text-slate-600">UH (%)</label>
                                <input type="number" id="wUh" value="25" onchange="recalculateAllGrades()" class="w-full p-2 border border-slate-200 rounded-lg text-xs font-bold bg-white">
                            </div>
                            <div>
                                <label class="block text-[11px] font-semibold text-slate-600">PTS (%)</label>
                                <input type="number" id="wPts" value="25" onchange="recalculateAllGrades()" class="w-full p-2 border border-slate-200 rounded-lg text-xs font-bold bg-white">
                            </div>
                            <div>
                                <label class="block text-[11px] font-semibold text-slate-600">PAS (%)</label>
                                <input type="number" id="wPas" value="25" onchange="recalculateAllGrades()" class="w-full p-2 border border-slate-200 rounded-lg text-xs font-bold bg-white">
                            </div>
                        </div>

                        <!-- Tabel Input & Hasil Kalkulasi Otomatis -->
                        <div class="overflow-x-auto">
                            <table class="w-full text-left text-sm border-collapse">
                                <thead class="bg-slate-100 text-slate-700">
                                    <tr>
                                        <th class="p-3 rounded-tl-xl">Nama Siswa</th>
                                        <th class="p-3 text-center w-24">Tugas</th>
                                        <th class="p-3 text-center w-24">UH</th>
                                        <th class="p-3 text-center w-24">PTS</th>
                                        <th class="p-3 text-center w-24">PAS</th>
                                        <th class="p-3 text-center">Nilai Akhir</th>
                                        <th class="p-3 rounded-tr-xl text-center">Predikat</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    ${appData.students.map((st) => {
                                        const g = appData.grades[st.id] || { tugas: 0, uh: 0, pts: 0, pas: 0, finalScore: 0, predicate: 'D' };
                                        return `
                                        <tr class="border-b border-slate-100">
                                            <td class="p-3 font-semibold text-slate-800">${st.name} <span class="text-xs text-slate-400 font-normal">(${st.className})</span></td>
                                            <td class="p-2 text-center"><input type="number" min="0" max="100" value="${g.tugas}" oninput="updateStudentGrade('${st.id}', 'tugas', this.value)" class="w-16 p-1.5 border border-slate-200 rounded-lg text-center text-xs font-semibold"></td>
                                            <td class="p-2 text-center"><input type="number" min="0" max="100" value="${g.uh}" oninput="updateStudentGrade('${st.id}', 'uh', this.value)" class="w-16 p-1.5 border border-slate-200 rounded-lg text-center text-xs font-semibold"></td>
                                            <td class="p-2 text-center"><input type="number" min="0" max="100" value="${g.pts}" oninput="updateStudentGrade('${st.id}', 'pts', this.value)" class="w-16 p-1.5 border border-slate-200 rounded-lg text-center text-xs font-semibold"></td>
                                            <td class="p-2 text-center"><input type="number" min="0" max="100" value="${g.pas}" oninput="updateStudentGrade('${st.id}', 'pas', this.value)" class="w-16 p-1.5 border border-slate-200 rounded-lg text-center text-xs font-semibold"></td>
                                            <td class="p-3 text-center font-extrabold text-indigo-700" id="final_${st.id}">${g.finalScore}</td>
                                            <td class="p-3 text-center" id="pred_${st.id}">
                                                <span class="px-2.5 py-0.5 rounded-lg text-xs font-bold ${getPredicateBadge(g.predicate)}">${g.predicate}</span>
                                            </td>
                                        </tr>`;
                                    }).join('') || '<tr><td colspan="7" class="p-6 text-center text-xs text-slate-400">Belum ada data siswa. Tambahkan siswa di menu Data Siswa terlebih dahulu.</td></tr>'}
                                </tbody>
                            </table>
                        </div>
                    </div>
                `;
            }
        }

        // ==================== HELPER FUNCTIONS JURNAL GURU ====================
        function testTTSVoice() {
            const msg = new SpeechSynthesisUtterance(`Halo Bapak atau Ibu ${currentUserName}, saatnya memasuki jam mengajar. Selamat bertugas.`);
            msg.lang = 'id-ID';
            window.speechSynthesis.speak(msg);
        }

        function toggleTTS() {
            ttsEnabled = !ttsEnabled;
            const btn = document.getElementById('ttsToggleBtn');
            if (btn) {
                btn.innerText = `Status: ${ttsEnabled ? 'Aktif' : 'Nonaktif'}`;
                btn.className = `px-3.5 py-2 ${ttsEnabled ? 'bg-emerald-600' : 'bg-slate-800'} text-white rounded-xl text-xs font-semibold shadow-sm`;
            }
            if (ttsEnabled) {
                testTTSVoice();
                ttsInterval = setInterval(() => {
                    const now = new Date();
                    const days = ['Minggu', 'Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'];
                    const currentDay = days[now.getDay()];
                    const currentTime = now.toTimeString().slice(0, 5);
                    appData.schedules.forEach(s => {
                        if (s.day === currentDay && s.start === currentTime && now.getSeconds() === 0) {
                            const alertMsg = new SpeechSynthesisUtterance(`Perhatian ${currentUserName}, jadwal mengajar kelas ${s.className} dimulai sekarang.`);
                            alertMsg.lang = 'id-ID';
                            window.speechSynthesis.speak(alertMsg);
                        }
                    });
                }, 1000);
            } else {
                clearInterval(ttsInterval);
            }
        }

        function addScheduleItem() {
            const day = document.getElementById('schedDay').value;
            const start = document.getElementById('schedStart').value;
            const end = document.getElementById('schedEnd').value;
            const className = document.getElementById('schedClass').value.trim();
            if (!className) return alert("Isi Kelas & Mata Pelajaran terlebih dahulu.");
            appData.schedules.push({ day, start, end, className });
            saveDataToCloud();
            switchJurnalTab('jadwal');
        }

        function toggleManualStudentForm() {
            const box = document.getElementById('manualStudentBox');
            if (box) box.classList.toggle('hidden');
        }

        function addManualStudent() {
            const name = document.getElementById('stuName').value.trim();
            const nis = document.getElementById('stuNis').value.trim();
            const className = document.getElementById('stuClass').value.trim() || 'Umum';
            if (!name) return alert("Nama siswa wajib diisi.");
            appData.students.push({
                id: 'stu_' + Date.now() + '_' + Math.floor(Math.random() * 1000),
                name,
                nis,
                className
            });
            saveDataToCloud();
            switchJurnalTab('siswa');
        }

        function importStudentsFromExcel(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(evt) {
                const data = new Uint8Array(evt.target.result);
                const workbook = XLSX.read(data, { type: 'array' });
                const sheet = workbook.Sheets[workbook.SheetNames[0]];
                const rows = XLSX.utils.sheet_to_json(sheet);
                let count = 0;
                rows.forEach((r, idx) => {
                    const name = r.Nama || r['Nama Lengkap'] || r.Name || r.nama;
                    if (name) {
                        appData.students.push({
                            id: 'stu_' + Date.now() + '_' + idx,
                            name: String(name).trim(),
                            nis: String(r.NIS || r.NISN || r.nis || '').trim(),
                            className: String(r.Kelas || r.Class || r.kelas || 'Umum').trim()
                        });
                        count++;
                    }
                });
                saveDataToCloud();
                switchJurnalTab('siswa');
                alert(`Berhasil mengimpor ${count} data siswa dari file Excel/CSV!`);
            };
            reader.readAsArrayBuffer(file);
        }

        function deleteStudent(id) {
            appData.students = appData.students.filter(s => s.id !== id);
            delete appData.grades[id];
            saveDataToCloud();
            switchJurnalTab('siswa');
        }

        function setStudentAttendance(date, studentId, status) {
            if (!appData.attendance[date]) appData.attendance[date] = {};
            appData.attendance[date][studentId] = status;
            switchJurnalTab('presensi');
        }

        function markAllPresent(date) {
            if (appData.students.length === 0) return alert("Belum ada data siswa.");
            if (!appData.attendance[date]) appData.attendance[date] = {};
            appData.students.forEach(st => {
                appData.attendance[date][st.id] = 'hadir';
            });
            switchJurnalTab('presensi');
        }

        function getPredicate(score) {
            if (score >= 90) return 'A (Sangat Baik)';
            if (score >= 80) return 'B (Baik)';
            if (score >= 70) return 'C (Cukup)';
            return 'D (Perlu Bimbingan)';
        }

        function getPredicateBadge(pred) {
            if (pred.startsWith('A')) return 'bg-emerald-100 text-emerald-800';
            if (pred.startsWith('B')) return 'bg-blue-100 text-blue-800';
            if (pred.startsWith('C')) return 'bg-amber-100 text-amber-800';
            return 'bg-rose-100 text-rose-800';
        }

        function updateStudentGrade(studentId, field, value) {
            if (!appData.grades[studentId]) {
                appData.grades[studentId] = { tugas: 0, uh: 0, pts: 0, pas: 0, finalScore: 0, predicate: 'D (Perlu Bimbingan)' };
            }
            appData.grades[studentId][field] = parseFloat(value) || 0;
            computeSingleStudentGrade(studentId);
        }

        function computeSingleStudentGrade(studentId) {
            const wTugas = (parseFloat(document.getElementById('wTugas')?.value) || 0) / 100;
            const wUh = (parseFloat(document.getElementById('wUh')?.value) || 0) / 100;
            const wPts = (parseFloat(document.getElementById('wPts')?.value) || 0) / 100;
            const wPas = (parseFloat(document.getElementById('wPas')?.value) || 0) / 100;

            const g = appData.grades[studentId];
            const finalScore = ((g.tugas * wTugas) + (g.uh * wUh) + (g.pts * wPts) + (g.pas * wPas)).toFixed(1);
            const predicate = getPredicate(parseFloat(finalScore));

            g.finalScore = finalScore;
            g.predicate = predicate;

            const finalEl = document.getElementById(`final_${studentId}`);
            const predEl = document.getElementById(`pred_${studentId}`);
            if (finalEl) finalEl.innerText = finalScore;
            if (predEl) predEl.innerHTML = `<span class="px-2.5 py-0.5 rounded-lg text-xs font-bold ${getPredicateBadge(predicate)}">${predicate}</span>`;
        }

        function recalculateAllGrades() {
            appData.students.forEach(st => {
                if (appData.grades[st.id]) {
                    computeSingleStudentGrade(st.id);
                }
            });
        }

        // Inisialisasi Halaman Awal
        renderAuth('login');
    </script>
</body>
</html>
